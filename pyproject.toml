[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "cloud_utils.__version__"}

[tool.setuptools_scm]
write_to = "src/cloud_utils/_version.py"

[project]
name = "cloud-utils"
dynamic = ["version"]
description = "Unified cloud utilities for AWS (sync & async)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "RonyK", email = "sangron@naver.com"}
]
maintainers = [
    {name = "RonyK", email = "sangron@naver.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
keywords = ["cloud", "aws", "gcp", "azure", "async", "aio", "utilities"]
dependencies = [
    # Core dependencies minimized
]

[project.optional-dependencies]
# AWS dependencies
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
aws-aio = [
    "aioboto3>=12.0.0",
]
# GCP dependencies (planned for future development)
gcp = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-pubsub>=2.20.0",
]
gcp-aio = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-pubsub>=2.20.0",
    "aiohttp>=3.9.0",
]
# Azure dependencies (planned for future development)
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-servicebus>=7.11.0",
]
azure-aio = [
    "azure-storage-blob>=12.20.0",
    "azure-servicebus>=7.11.0",
    "aiohttp>=3.9.0",
]
# OpenSearch dependencies
opensearch = [
    "opensearch-py>=2.0.0",
]
# HTTP client dependencies
http-aio = [
    "aiohttp>=3.9.0",
    "anyio>=4.0.0",
]
# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "moto>=4.2.0",
]
# Testing tools
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "moto>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/your-org/cloud-utils"
Documentation = "https://cloud-utils.readthedocs.io"
Repository = "https://github.com/your-org/cloud-utils.git"
Issues = "https://github.com/your-org/cloud-utils/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloud_utils*"]

# PEP 561 type hints deployment
[tool.setuptools.package-data]
"cloud_utils" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cloud_utils"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=cloud_utils",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["cloud_utils"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
