[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-utils"
dynamic = ["version"]
description = "Unified cloud utilities for AWS, Google Cloud, and Azure (sync & async)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Cloud Utils Team", email = "team@cloud-utils.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
keywords = ["cloud", "aws", "gcp", "azure", "async", "aio", "utilities"]
dependencies = [
    # 코어 의존성 최소화
]

[project.optional-dependencies]
# AWS 관련 의존성
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
aws-aio = [
    "aioboto3>=12.0.0",
]
# GCP 관련 의존성 (향후 개발 예정)
gcp = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-pubsub>=2.20.0",
]
gcp-aio = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-pubsub>=2.20.0",
    "aiohttp>=3.9.0",
]
# Azure 관련 의존성 (향후 개발 예정)
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-servicebus>=7.11.0",
]
azure-aio = [
    "azure-storage-blob>=12.20.0",
    "azure-servicebus>=7.11.0",
    "aiohttp>=3.9.0",
]
# OpenSearch 의존성
opensearch = [
    "opensearch-py>=2.0.0",
]
# HTTP 클라이언트 의존성
http-aio = [
    "aiohttp>=3.9.0",
    "anyio>=4.0.0",
]
# 개발 도구
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "moto>=4.2.0",
]
# 테스트 도구
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "moto>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/your-org/cloud-utils"
Documentation = "https://cloud-utils.readthedocs.io"
Repository = "https://github.com/your-org/cloud-utils.git"
Issues = "https://github.com/your-org/cloud-utils/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloud_utils*"]

# PEP 561 타입 힌트 배포
[tool.setuptools.package-data]
"cloud_utils" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["cloud_utils"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=cloud_utils",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["cloud_utils"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
